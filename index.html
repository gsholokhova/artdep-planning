  .range-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    color: var(--ink-soft);
    min-width: 150px;
  }
  .spacer { flex: 1; }
  button {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 7px 12px;
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  button:hover { background: var(--hover); }
  button:focus-visible { outline: 2px solid var(--today); outline-offset: 1px; }
  button.primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  button.primary:hover { opacity: 0.88; background: var(--ink); }
  #absBtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .nav-group { display: flex; gap: 6px; }
  .status-pill {
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 20px;
    background: #FFF4D6;
    color: #8A6A00;
    border: 1px solid #F0DFA6;
  }
  .status-pill.live { background: #E3F5EC; color: #0B7A4B; border-color: #BCE5D1; }
  html[data-theme="dark"] .status-pill { background: #3A3110; color: #E8C860; border-color: #5A4C1A; }
  html[data-theme="dark"] .status-pill.live { background: #10321F; color: #5FD39A; border-color: #1E4A30; }

  /* ── Board ───────────────────────────────── */
  .board { flex: 1; overflow: auto; position: relative; -webkit-overflow-scrolling: touch; }
  .canvas {
    position: relative;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }
  .row.filler { flex: 1; border-bottom: none; min-height: 40px; }

  .head-row {
    display: flex;
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line-strong);
  }
  .corner {
    position: sticky;
    left: 0;
    z-index: 21;
    width: var(--name-w);
    min-width: var(--name-w);
    background: var(--bg);
    border-right: 1px solid var(--line-strong);
    padding: 6px 10px 6px 14px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 6px;
  }
  .corner .filter-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 9px; border-radius: 7px;
    font-size: 13px; font-weight: 600; color: var(--ink);
    border: 1px solid var(--line-strong); background: var(--surface);
    max-width: calc(var(--name-w) - 44px); overflow: hidden;
  }
  .corner .filter-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .corner .filter-btn svg { flex-shrink: 0; opacity: .6; }
  .corner .mini-add {
    width: 26px; height: 26px;
    padding: 0;
    border-radius: 7px;
    font-size: 15px;
    line-height: 1;
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  .filter-panel {
    position: fixed;
    z-index: 45;
    width: 240px;
    max-height: 70vh;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.2);
    padding: 6px;
    display: none;
  }
  .filter-panel.open { display: block; }
  .fp-all {
    padding: 8px 10px; border-radius: 7px; cursor: pointer;
    font-weight: 600; font-size: 13.5px;
  }
  .fp-all:hover { background: var(--hover); }
  .fp-all.on { background: var(--ink); color: var(--bg); }
  .fp-team {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 10px 4px; cursor: pointer;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft);
  }
  .fp-team-toggle { font-family: 'Inter', sans-serif; font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 11px; }
  .fp-team:hover .fp-team-toggle { color: var(--accent); }
  .fp-item {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 13.5px;
  }
  .fp-item:hover { background: var(--hover); }
  .fp-box {
    width: 15px; height: 15px; flex-shrink: 0; border-radius: 50%;
    border: 1.5px solid var(--line-strong); background: transparent;
    box-sizing: border-box;
  }
  .fp-box.on { border-color: var(--accent); background: var(--accent); }
  .fp-arch-title {
    margin-top: 6px; padding: 8px 10px 4px; border-top: 1px solid var(--line);
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft);
  }
  .fp-arch { padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--ink-soft); }
  .fp-arch:hover { background: var(--hover); color: var(--ink); }
  .person-pop {
    position: fixed;
    top: 64px; left: 16px;
    z-index: 55;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 14px;
    width: 250px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: none;
  }
  .person-pop.open { display: block; }
  .person-pop .pp-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 2px;
  }
  .person-pop label { display: block; font-size: 12px; color: var(--ink-soft); margin: 9px 0 4px; }
  .person-pop input, .person-pop select {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    font-size: 13.5px;
    font-family: 'Inter', sans-serif;
  }
  .person-pop .pp-actions { display: flex; gap: 6px; margin-top: 13px; }
  .person-pop .pp-actions button { flex: 1; }
  .tip {
    position: fixed;
    z-index: 70;
    max-width: 260px;
    background: var(--ink);
    color: var(--bg);
    font-size: 12px;
    line-height: 1.45;
    padding: 8px 11px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .12s;
  }
  .tip.show { opacity: 1; }
  .day-head {
    width: var(--day-w);
    min-width: var(--day-w);
    text-align: center;
    padding: 6px 0 5px;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .day-head .m {
    display: block;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 11px;
    color: var(--ink);
    text-transform: uppercase;
    height: 14px;
    white-space: nowrap;
    text-align: left;
    padding-left: 2px;
  }
  .day-head .d { display: block; font-weight: 500; }
  .day-head.weekend .d { color: var(--line-strong); }
  .day-head.sprint { box-shadow: inset 0 -2px 0 var(--today); }
  .day-head.today-col .d {
    color: #fff;
    background: var(--today);
    border-radius: 20px;
    width: 22px; height: 18px;
    line-height: 18px;
    margin: 0 auto;
  }

  .group-row { display: flex; position: relative; }
  .group-label {
    position: sticky;
    left: 0;
    z-index: 15;
    width: var(--name-w);
    min-width: var(--name-w);
    background: var(--bg);
    border-right: 1px solid var(--line-strong);
    padding: 14px 14px 5px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .group-track { flex: 1; }

  .row { display: flex; border-bottom: 1px solid var(--line); transition: background .1s; }
  .row.drop-target { background: var(--drop); }
  .row.drop-target .name-cell { background: var(--drop); }
  .name-cell {
    position: sticky;
    left: 0;
    z-index: 15;
    width: var(--name-w);
    min-width: var(--name-w);
    background: var(--bg);
    border-right: 1px solid var(--line-strong);
    padding: 10px 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .name-cell .nm { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
  .name-cell .role {
    display: block;
    font-weight: 400;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 1px;
  }
  .load-badge {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 12px;
    min-width: 24px;
    height: 22px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 7px;
    background: var(--panel);
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  .load-badge.l1 { background: #E3F5EC; color: #0B7A4B; }
  .load-badge.l2 { background: #FFF1D6; color: #9A6B00; }
  .load-badge.l3 { background: #FFE2DB; color: #C0341D; }
  html[data-theme="dark"] .load-badge.l1 { background: #10321F; color: #5FD39A; }
  html[data-theme="dark"] .load-badge.l2 { background: #3A3110; color: #E8C860; }
  html[data-theme="dark"] .load-badge.l3 { background: #3E1A12; color: #FF8A70; }

  .track {
    position: relative;
    background:
      repeating-linear-gradient(to right,
        transparent 0, transparent calc(var(--day-w) * 5),
        var(--weekend) calc(var(--day-w) * 5), var(--weekend) calc(var(--day-w) * 7)),
      repeating-linear-gradient(to right,
        var(--line) 0, var(--line) 1px,
        transparent 1px, transparent var(--day-w));
  }

  .bar {
    position: absolute;
    height: 26px;
    border-radius: 6px;
    border: 1.5px solid transparent;
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    cursor: grab;
    box-shadow: 0 1px 2px rgba(0,0,0,0.10);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }
  .bar:hover { box-shadow: 0 3px 8px rgba(0,0,0,0.16); }
  .bar.dragging { cursor: grabbing; opacity: 0.9; z-index: 12; box-shadow: 0 6px 16px rgba(0,0,0,0.22); }
  .bar.no-drag { touch-action: auto; cursor: pointer; }
  .bar.no-drag .handle { display: none; }
  .bar .b-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .b-meta {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 11px;
    opacity: 0.85;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .bar .b-link {
    flex-shrink: 0;
    width: 16px; height: 16px;
    border-radius: 4px;
    background: rgba(255,255,255,0.25);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: inherit;
  }
  .bar .b-link:hover { background: rgba(255,255,255,0.45); }
  .bar .b-link svg { width: 10px; height: 10px; display: block; }
  .bar .handle { position: absolute; top: 0; bottom: 0; width: 9px; cursor: ew-resize; }
  .bar .handle.h-start { left: 0; }
  .bar .handle.h-end { right: 0; }
  .bar .handle::after {
    content: '';
    position: absolute;
    top: 7px; bottom: 7px;
    width: 3px;
    border-radius: 2px;
    background: rgba(255,255,255,0.55);
    opacity: 0;
    transition: opacity .1s;
  }
  .bar .handle.h-start::after { left: 3px; }
  .bar .handle.h-end::after { right: 3px; }
  .bar:hover .handle::after { opacity: 1; }
  .person-pop .pp-edit-actions { margin-top: 8px; }
  .person-pop .pp-edit-actions #npArchive { flex: 1; }
  .bar.planned {
    background: transparent !important;
    border: 1.5px dashed currentColor;
    box-shadow: none;
  }
  .bar.planned .b-link { background: color-mix(in srgb, currentColor 14%, transparent); }
  .bar.planned .handle::after { background: color-mix(in srgb, currentColor 45%, transparent); }
  .bar.absence {
    color: var(--ink-soft);
    background: repeating-linear-gradient(135deg, var(--abs-a) 0 6px, var(--abs-b) 6px 12px) !important;
    border: 1px dashed var(--line-strong);
    box-shadow: none;
  }

<script>
/* ═══════════════════════════════════════════════════════════
   НАСТРОЙКА
   1) API_URL — URL опубликованного Apps Script Web App.
      Пока пустой — интерфейс работает на демо-данных.
   2) HOLIDAYS — праздничные дни (не считаются рабочими).
      Дополняйте под свой календарь.
   ═══════════════════════════════════════════════════════════ */
const API_URL = "https://script.google.com/macros/s/AKfycbzXzQObbTlxOHckdaFjEZI0jwqiEhHTQyc_3pLjusikmFcc9KQ7DMk7i4d6NcmuAp7R/exec";

const HOLIDAYS = [
  "2026-01-01",
  "2026-12-25",
  "2026-12-26",
];

/* Спринт: длина в неделях, старт — понедельник текущей недели */
const SPRINT_WEEKS = 1;

/* Веса интенсивности: доля дня, которую проект «просит» у человека.
   «Планируется» имеет вес 0 — застолблённое время, в загрузку не входит. */
const MODE_W = { active: 1, background: 0.5, planned: 0 };
const MODE_LABEL = { background: "фон", planned: "план" };
const MODE_HINT = {
  active: "Делается руками, принимается активное участие, требует фокуса.",
  background: "Авторский надзор, консультации, редкие правки.",
  planned: "Ещё не в работе, но планируется.",
};
function weightOf(it) { return MODE_W[it.mode || "active"] ?? 1; }

const OUTSOURCE = "Аутсорс";
const OUTSOURCE_ENTRY = { group: "Аутсорс", name: OUTSOURCE, role: "фриланс-блок", team: "" };
// порядок грейдов для сортировки инхауса: senior → middle → junior → director
const GRADE_ORDER = { senior: 0, middle: 1, junior: 2, expert: 1, director: 3 };
function gradeRank(role) { return GRADE_ORDER[role] ?? 1.5; }
let PEOPLE = [
  { group: "Инхаус",  name: "Ника Вечерковская", role: "senior",   team: "Design" },
  { group: "Инхаус",  name: "Саша Созинов",      role: "senior",   team: "Design" },
  { group: "Инхаус",  name: "Юля Михарева",      role: "middle",   team: "Design" },
  { group: "Инхаус",  name: "Полина Коровина",   role: "junior",   team: "Design" },
  OUTSOURCE_ENTRY,
];
// инхаус всегда отсортирован по грейду
function sortPeople() {
  const inh = PEOPLE.filter(p => p.group === "Инхаус")
    .sort((a, b) => gradeRank(a.role) - gradeRank(b.role) || a.name.localeCompare(b.name));
  PEOPLE = [...inh, OUTSOURCE_ENTRY];
}

// ── фильтр превью: множество выбранных имён. Пусто = «Все». ──
const TEAM_LABEL = { Design: "Дизайн", Creative: "Креатив" };
let nameFilter = new Set();
let absOnly = false;   // показывать только отсутствия
function personVisible(p) {
  if (p.team === "Архив") return false;         // архив в планнинге не показываем
  if (nameFilter.size === 0) return true;       // «Все»
  return nameFilter.has(p.name);
}
// список видимых людей, сгруппированный для доски: Дизайн, Креатив, Аутсорс
function displayGroups() {
  const groups = [];
  for (const teamKey of ["Design", "Creative"]) {
    const ppl = PEOPLE.filter(p => p.group === "Инхаус" && (p.team || "Design") === teamKey && personVisible(p));
    if (ppl.length) groups.push({ label: TEAM_LABEL[teamKey], people: ppl });
  }
  const out = PEOPLE.filter(p => p.group === "Аутсорс" && personVisible(p));
  if (out.length) groups.push({ label: "Аутсорс", people: out });
  return groups;
}

const COLORS = ["#276952", "#2F495A", "#473D3D", "#5FA96E", "#607ED1", "#61A5D5", "#64B7B3", "#768E9F", "#773557", "#807F7A", "#895D93", "#90B2CC", "#96B08F", "#9A8AD9", "#A55F5F", "#AD9992", "#B59CE0", "#C36936", "#C44646", "#CB597F", "#CEC244", "#DA82D9", "#EB9A5B", "#ED7779"];

const NAME_W = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--name-w'));
const DAY_W = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--day-w'));
const IS_TOUCH = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

/* ── демо-данные (замещаются данными из таблицы) ── */
function demoData() {
  const t = new Date(); t.setHours(0,0,0,0);
  const iso = (offset) => { const d = new Date(t); d.setDate(d.getDate()+offset); return toISO(d); };
  const fg = "https://www.figma.com/design/demo";
  return [
    { id:"d1", type:"project", person:"Ника Вечерковская", project:"Ребрендинг X",     start:iso(-9), end:iso(4),  color:"#2B5CFF", figma:fg, weekends:"", mode:"active", freelancer:"" },
    { id:"d2", type:"project", person:"Ника Вечерковская", project:"Кампания весна",   start:iso(2),  end:iso(15), color:"#FF6B4A", figma:fg, weekends:"", mode:"planned", freelancer:"" },
    { id:"d3", type:"project", person:"Саша Созинов",      project:"Сайт клиники",     start:iso(-4), end:iso(9),  color:"#00A876", figma:fg, weekends:"", mode:"active", freelancer:"" },
    { id:"d4", type:"absence", person:"Саша Созинов",      project:"Отпуск",           start:iso(12), end:iso(18), color:"", figma:"", weekends:"", mode:"", freelancer:"" },
    { id:"d5", type:"project", person:"Юля Михарева",      project:"Кампания весна",   start:iso(0),  end:iso(11), color:"#FF6B4A", figma:fg, weekends:"", mode:"active", freelancer:"" },
    { id:"d6", type:"project", person:"Юля Михарева",      project:"Соцсети ретейнер", start:iso(-12),end:iso(24), color:"#9B51E0", figma:"", weekends:"", mode:"background", freelancer:"" },
    { id:"d7", type:"project", person:"Полина Коровина",   project:"Ребрендинг X",     start:iso(-9), end:iso(6),  color:"#2B5CFF", figma:fg, weekends:"", mode:"active", freelancer:"" },
    { id:"d8", type:"project", person:"Полина Коровина",   project:"Презентация Y",    start:iso(8),  end:iso(13), color:"#F0A800", figma:"", weekends:"", mode:"background", freelancer:"" },
    { id:"d9", type:"project", person:OUTSOURCE,           project:"3D для кампании",  start:iso(4),  end:iso(16), color:"#0FA3B1", figma:fg, weekends:"", mode:"active", freelancer:"Женя Крылова" },
  ];
}

/* ── состояние ── */
let items = [];
let viewStart = mondayOf(addDays(today(), -7));
const VIEW_DAYS = 70;
let editingId = null;
let rowMeta = [];
let editWeekends = new Set();

/* ── утилиты дат ── */
function today() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d) { const x = new Date(d); const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function toISO(d) { return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fromISO(s) { const [y,m,dd] = s.split("-").map(Number); return new Date(y, m-1, dd); }
function dayDiff(a, b) { return Math.round((b - a) / 86400000); }
const MONTHS = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
const WD = ["пн","вт","ср","чт","пт","сб","вс"];
function fmtShort(iso) { const d = fromISO(iso); return d.getDate() + " " + MONTHS[d.getMonth()]; }
function fmtRu(iso) {
  if (!iso) return "";
  const [y,m,d] = iso.split("-");
  return `${d}.${m}.${y}`;
}
function parseRu(s) {
  const m = s.trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (!m) return null;
  const d = new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
  if (d.getDate() !== Number(m[1]) || d.getMonth() !== Number(m[2])-1) return null;
  return toISO(d);
}
function weeksLabel(start, end) {
  const days = dayDiff(fromISO(start), fromISO(end)) + 1;
  const w = days / 7;
  const s = (Math.round(w * 10) / 10).toString().replace(".", ",");
  return s.replace(",0", "") + " нед";
}

function sprintRange() {
  const s = mondayOf(today());
  return [toISO(s), toISO(addDays(s, SPRINT_WEEKS * 7 - 1))];
}

/* Число календарных дней отсутствия за текущий год (объединение периодов) */
function absenceDaysThisYear(personItems) {
  const year = today().getFullYear();
  const yStart = year + "-01-01", yEnd = year + "-12-31";
  const days = new Set();
  for (const it of personItems) {
    if (it.type !== "absence") continue;
    let s = it.start < yStart ? yStart : it.start;
    let e = it.end > yEnd ? yEnd : it.end;
    if (e < s) continue;
    let d = fromISO(s);
    const end = fromISO(e);
    while (d <= end) { days.add(toISO(d)); d = addDays(d, 1); }
  }
  return days.size;
}

/* ── расчёт занятости ─────────────────────────
   День считается рабочим для проекта, если это будний
   день (не праздник) ИЛИ выходной, отмеченный в карточке.
   В каждый такой день загрузка делится между проектами
   пропорционально их весам интенсивности (активный 1,
   фоновый 0.5, надзор 0.2). Если суммарный вес дня меньше 1,
   у человека остаётся свободная ёмкость — надзор в одиночку
   даёт 20%, а не 100%.
   Средняя занятость на проекте = среднее по всем таким дням. */
function isBusinessDay(iso) {
  const wd = (fromISO(iso).getDay() + 6) % 7;
  return wd < 5 && !HOLIDAYS.includes(iso);
}
function weekendSet(it) {
  return new Set((it.weekends || "").split(",").filter(Boolean));
}
function dayCounts(it, iso) {
  return isBusinessDay(iso) || weekendSet(it).has(iso);
}
function concurrencyKey(it) {
  return it.person === OUTSOURCE ? OUTSOURCE + "|" + (it.freelancer || "") : it.person;
}
function computeLoad(it) {
  if (it.type !== "project") return 0;
  let sum = 0, n = 0;
  let d = fromISO(it.start);
  const end = fromISO(it.end);
  const key = concurrencyKey(it);
  while (d <= end) {
    const iso = toISO(d);
    if (dayCounts(it, iso)) {
      const totalW = items
        .filter(x =>
          x.type === "project" &&
          concurrencyKey(x) === key &&
          x.start <= iso && x.end >= iso &&
          dayCounts(x, iso))
        .reduce((s2, x) => s2 + weightOf(x), 0);
      sum += 100 * weightOf(it) / Math.max(totalW, 1);
      n++;
    }
    d = addDays(d, 1);
  }
  return n ? Math.round(sum / n) : 0;
}

function normDate(v) {
  if (v === null || v === undefined) return "";
  v = String(v).trim();
  if (!v) return "";
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);            // ГГГГ-ММ-ДД или ISO-датавремя
  if (m) return m[1] + "-" + m[2].padStart(2,"0") + "-" + m[3].padStart(2,"0");
  m = v.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/);          // ДД.ММ.ГГГГ или ДД/ММ/ГГГГ
  if (m) return m[3] + "-" + m[2].padStart(2,"0") + "-" + m[1].padStart(2,"0");
  // сырые JS-даты из Apps Script: "Wed May 27 2026 00:00:00 GMT+0500 (…)" — берём токены, игнорируя пояс
  m = v.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{1,2})\s+(\d{4})/);
  if (m) {
    const mo = { Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",Jul:"07",Aug:"08",Sep:"09",Oct:"10",Nov:"11",Dec:"12" }[m[1]];
    return m[3] + "-" + mo + "-" + m[2].padStart(2,"0");
  }
  const d = new Date(v);                                        // последний шанс — нативный парсер
  if (!isNaN(d)) return toISO(d);
  return "";
}
function normalize(it) {
  const o = { figma:"", freelancer:"", weekends:"", mode:"active", ...it };
  if (o.mode === "supervision") o.mode = "background";
  o.start = normDate(o.start);
  o.end = normDate(o.end);
  o.weekends = String(o.weekends || "").split(",").map(normDate).filter(Boolean).join(",");
  if (o.start && o.end && o.end < o.start) { const t = o.start; o.start = o.end; o.end = t; }
  return o;
}

/* ── цвет как свойство проекта ──
   Все колбаски одного проекта одного цвета; цвет берётся из палитры
   стабильно по названию, с учётом уже выбранного вручную. */
let projectColors = {};
function stableIndex(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return h % COLORS.length;
}
function buildProjectColors() {
  projectColors = {};
  const byProj = {};
  for (const it of items) {
    if (it.type !== "project") continue;
    (byProj[it.project] = byProj[it.project] || []).push(it);
  }
  const names = Object.keys(byProj).sort();
  const used = new Set();
  const pending = [];
  // Проход 1: закрепляем проекты, где уже есть цвет из палитры (доминирующий)
  for (const name of names) {
    const counts = {};
    for (const b of byProj[name]) if (b.color && COLORS.includes(b.color)) counts[b.color] = (counts[b.color]||0)+1;
    const chosen = Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
    if (chosen) { projectColors[name] = chosen; used.add(chosen); }
    else pending.push(name);
  }
  // Проход 2: остальным — предпочтительный по хэшу, иначе ближайший свободный
  for (const name of pending) {
    let idx = stableIndex(name);
    let color = COLORS[idx];
    if (used.size < COLORS.length) {
      let probes = 0;
      while (used.has(color) && probes < COLORS.length) { idx = (idx+1) % COLORS.length; color = COLORS[idx]; probes++; }
    }
    projectColors[name] = color;
    used.add(color);
  }
}
function projectColor(it) {
  if (it.type !== "project") return it.color || "#888";
  return projectColors[it.project] || it.color || COLORS[stableIndex(it.project)];
}

/* ── справочник проектов ── */
function projectDirectory() {
  const map = new Map();
  for (const it of items) {
    if (it.type !== "project") continue;
    if (!map.has(it.project)) map.set(it.project, { name: it.project, color: projectColor(it), figma: it.figma });
    else {
      const p = map.get(it.project);
      if (!p.figma && it.figma) p.figma = it.figma;
    }
  }
  return [...map.values()];
}

/* ── раскладка полос по дорожкам ── */
function computeLanes(list) {
  const sorted = [...list].sort((a,b) => a.start.localeCompare(b.start));
  const laneEnds = [];
  for (const it of sorted) {
    let lane = laneEnds.findIndex(end => end < it.start);
    if (lane === -1) { lane = laneEnds.length; laneEnds.push(it.end); }
    else laneEnds[lane] = it.end;
    it._lane = lane;
  }
  return { list: sorted, lanes: Math.max(1, laneEnds.length) };
}

function barMeta(it) {

function buildBar(it, dw) {
  const s = fromISO(it.start), e = fromISO(it.end);
  const x1 = dayDiff(viewStart, s), x2 = dayDiff(viewStart, e) + 1;
  if (x2 <= 0 || x1 >= VIEW_DAYS) return null;

    + (it.type === "project" && mode === "background" ? " bg-mode" : "");
  bar.style.left = (clipL * dw) + "px";
  bar.style.width = Math.max((clipR - clipL) * dw, 20) + "px";
  bar.style.top = (8 + it._lane * 32) + "px";
  applyBarFill(bar, it);

  const label = it.freelancer ? `${it.project} — ${it.freelancer}` : it.project;

  bar.title = `${label} · ${fmtShort(it.start)} → ${fmtShort(it.end)} · ${meta}`;
  if (weekendSet(it).size) bar.title += " · работа в выходные: " + [...weekendSet(it)].map(fmtShort).join(", ");

}

/* Заливка колбаски: сплошной цвет проекта. Работа в выходные — только
   в карточке проекта, на таймлайне разрывов нет.
   На светлых цветах текст переключается на тёмный для читаемости. */
function applyBarFill(el, it) {
  const mode = it.mode || "active";
  if (it.type === "absence") return;              // отсутствия рисуются штриховкой из CSS
  const color = projectColor(it);
  if (mode === "planned") { el.style.color = color; el.style.background = ""; el.style.borderColor = ""; return; }
  if (mode === "background") {
    // фоновый: заливка 20% + сплошная обводка в цвет проекта
    el.style.background = `color-mix(in srgb, ${color} 20%, transparent)`;
    el.style.borderColor = color;
    el.style.color = "var(--ink)";                // текст в цвет темы — читается на прозрачном фоне
  } else {
    el.style.background = color;
    el.style.borderColor = "";
    el.style.color = "#fff";
  }
}

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

/* ── drag: перенос, смена человека, ресайз за края ── */
let drag = null;

function startDrag(ev, it, bar) {
  ev.preventDefault();
  const zone = ev.target.classList.contains("h-start") ? "start"
             : ev.target.classList.contains("h-end") ? "end" : "move";
  // Option/Alt + перетаскивание = дублирование проекта
  const dup = ev.altKey && zone === "move" && it.type === "project";
  let dragIt = it, visual = bar;
  if (dup) {
    dragIt = { ...it, id: "p" + Date.now() };
    items.push(dragIt);
    visual = bar.cloneNode(true);
    bar.parentElement.appendChild(visual);
  }
  drag = {
    it: dragIt, bar, visual, dup, zone,
    x0: ev.clientX, y0: ev.clientY,
    origStart: it.start, origEnd: it.end, origPerson: it.person,
    origId: it.id,
    moved: false,
    origLeft: parseFloat(bar.style.left),
    origWidth: parseFloat(bar.style.width),
    targetPerson: it.person,
    lastTargetRow: null,
  };
  bar.setPointerCapture(ev.pointerId);
  bar.addEventListener("pointermove", onDragMove);
  bar.addEventListener("pointerup", onDragEnd);
  bar.addEventListener("pointercancel", onDragEnd);
}

function onDragMove(ev) {
  if (!drag) return;
  const dw = DAY_W();
  const dx = ev.clientX - drag.x0;
  const dy = ev.clientY - drag.y0;
  if (!drag.moved && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
  drag.moved = true;
  drag.visual.classList.add("dragging");

  const dDays = Math.round(dx / dw);

  if (drag.zone === "move") {
    drag.it.start = toISO(addDays(fromISO(drag.origStart), dDays));
    drag.it.end   = toISO(addDays(fromISO(drag.origEnd), dDays));
    drag.visual.style.left = (drag.origLeft + dDays * dw) + "px";

    const canvas = document.getElementById("canvas");
    const cy = ev.clientY - canvas.getBoundingClientRect().top;
    let target = null;
    for (const rm of rowMeta) {
      const top = rm.rowEl.offsetTop, h = rm.rowEl.offsetHeight;
      if (cy >= top && cy < top + h) { target = rm; break; }
    }
    if (drag.lastTargetRow) drag.lastTargetRow.classList.remove("drop-target");
    if (target && target.person !== drag.origPerson) {
      target.rowEl.classList.add("drop-target");
      drag.lastTargetRow = target.rowEl;
      drag.targetPerson = target.person;
      const srcRow = rowMeta.find(r => r.person === drag.origPerson).rowEl;
      drag.visual.style.transform = `translateY(${target.rowEl.offsetTop - srcRow.offsetTop}px)`;
    } else {
      drag.targetPerson = drag.origPerson;
      drag.lastTargetRow = null;
      drag.visual.style.transform = "";
    }
  } else if (drag.zone === "start") {
    let ns = toISO(addDays(fromISO(drag.origStart), dDays));
    if (ns > drag.it.end) ns = drag.it.end;
    drag.it.start = ns;
    const shift = dayDiff(fromISO(drag.origStart), fromISO(ns));
    drag.visual.style.left = (drag.origLeft + shift * dw) + "px";
    drag.visual.style.width = Math.max(drag.origWidth - shift * dw, dw - 4) + "px";
  } else {
    let ne = toISO(addDays(fromISO(drag.origEnd), dDays));
    if (ne < drag.it.start) ne = drag.it.start;
    drag.it.end = ne;
    const shift = dayDiff(fromISO(drag.origEnd), fromISO(ne));
    drag.visual.style.width = Math.max(drag.origWidth + shift * dw, dw - 4) + "px";
  }

  const metaEl = drag.visual.querySelector(".b-meta");
  if (metaEl) metaEl.textContent = barMeta(drag.it);
  applyBarFill(drag.visual, drag.it);
}

async function onDragEnd(ev) {
  if (!drag) return;
  const d = drag; drag = null;
  d.visual.classList.remove("dragging");
  if (d.lastTargetRow) d.lastTargetRow.classList.remove("drop-target");
  d.bar.releasePointerCapture(ev.pointerId);
  d.bar.removeEventListener("pointermove", onDragMove);
  d.bar.removeEventListener("pointerup", onDragEnd);
  d.bar.removeEventListener("pointercancel", onDragEnd);

  if (!d.moved) {
    if (d.dup) {
      items = items.filter(x => x.id !== d.it.id);
      d.visual.remove();
    }
    openDrawer(d.origId);
    return;
  }

  if (d.zone === "move" && d.targetPerson !== d.origPerson) {
    d.it.person = d.targetPerson;
    if (d.it.person !== OUTSOURCE) d.it.freelancer = "";
  }
  // отметки выходных, выпавшие из нового диапазона, убираем
  d.it.weekends = [...weekendSet(d.it)]
    .filter(x => x >= d.it.start && x <= d.it.end)
    .join(",");

  const changed = d.dup || d.it.start !== d.origStart || d.it.end !== d.origEnd || d.it.person !== d.origPerson;
  render();
  if (changed) {
    await apiSave(d.it);
    toast(d.dup ? "Продублировано" : (API_URL ? "Сохранено в таблицу" : "Изменено (демо-режим)"));
  }
}

/* ── drawer ── */
let formType = "project";
let formMode = "active";
function setFormMode(m) {
  formMode = m;
  document.getElementById("modeActive").classList.toggle("on", m === "active");
  document.getElementById("modeBg").classList.toggle("on", m === "background");
  document.getElementById("modePlan").classList.toggle("on", m === "planned");
  document.getElementById("modeHint").textContent = MODE_HINT[m] || "";
  updateCalcLoad();
}
function openDrawer(id) {
  editingId = id || null;
  const it = id ? items.find(x => x.id === id) : null;
  document.getElementById("drawerTitle").textContent = it ? "Редактировать" : "Новый проект";
  document.getElementById("deleteBtn").style.display = it ? "block" : "none";
  document.getElementById("dupBtn").style.display = it ? "block" : "none";

  const sel = document.getElementById("fPerson");
  sel.innerHTML = PEOPLE.map(p => `<option value="${p.name}">${p.name}${p.group === "Аутсорс" ? "" : " — " + (p.team || "")}</option>`).join("");
  sel.value = it ? it.person : PEOPLE[0].name;

  setFormType(it ? it.type : "project");
  setFormMode(it && MODE_W.hasOwnProperty(it.mode) ? it.mode : "active");
  document.getElementById("fProject").value = it ? it.project : "";
  document.getElementById("fStart").value = fmtRu(it ? it.start : toISO(today()));
  document.getElementById("fEnd").value = fmtRu(it ? it.end : toISO(addDays(today(), 7)));
  document.getElementById("fFigma").value = it ? (it.figma || "") : "";
  document.getElementById("fFreelancer").value = it ? (it.freelancer || "") : "";
  editWeekends = it ? weekendSet(it) : new Set();
  selectColor(it && it.type === "project" ? projectColor(it) : (it && it.color ? it.color : COLORS[0]));
  updateFreelancerField();
  rebuildWeekendChips();
  updateCalcLoad();
  updateRoster();
  hideSuggest();

  document.getElementById("drawer").classList.add("open");
  document.getElementById("overlay").classList.add("open");
}
function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
  hideSuggest();
}
function setFormType(t) {
  formType = t;
  document.getElementById("typeProject").classList.toggle("on", t === "project");
  document.getElementById("typeAbsence").classList.toggle("on", t === "absence");
  const isAbs = t === "absence";
  document.getElementById("colorField").style.display = isAbs ? "none" : "block";
  document.getElementById("figmaField").style.display = isAbs ? "none" : "block";
  document.getElementById("modeField").style.display = isAbs ? "none" : "block";
  document.getElementById("fProjectLabel").textContent = isAbs ? "Причина" : "Проект";
  document.getElementById("fProject").placeholder = isAbs ? "Отпуск / болезнь" : "Начните печатать название…";
  updateFreelancerField();
  rebuildWeekendChips();
  updateCalcLoad();
}
function updateFreelancerField() {
  const show = formType === "project" && document.getElementById("fPerson").value === OUTSOURCE;
  document.getElementById("freelancerField").style.display = show ? "block" : "none";
}

/* выходные внутри диапазона — чипсы для отметки работы */
function formDates() {
  return {
    start: parseRu(document.getElementById("fStart").value),
    end: parseRu(document.getElementById("fEnd").value),
  };
}
function rebuildWeekendChips() {
  const box = document.getElementById("weekendField");
  const chips = document.getElementById("weekendChips");
  const { start, end } = formDates();
  if (formType === "absence" || !start || !end || end < start) { box.style.display = "none"; return; }
  chips.innerHTML = "";
  let found = 0;
  let d = fromISO(start);
  const endD = fromISO(end);
  while (d <= endD && found < 40) {
    const iso = toISO(d);
    const wd = (d.getDay()+6)%7;
    if (wd >= 5 || HOLIDAYS.includes(iso)) {
      found++;
      const chip = document.createElement("span");
      chip.className = "chip" + (editWeekends.has(iso) ? " on" : "");
      chip.textContent = `${WD[wd]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
      chip.addEventListener("click", () => {
        if (editWeekends.has(iso)) editWeekends.delete(iso); else editWeekends.add(iso);
        chip.classList.toggle("on");
        updateCalcLoad();
      });
      chips.appendChild(chip);
    }
    d = addDays(d, 1);
  }
  box.style.display = found ? "block" : "none";
}

/* живой предпросмотр расчётной занятости в карточке */
function updateCalcLoad() {
  const box = document.getElementById("calcLoad");
  const { start, end } = formDates();
  if (formType === "absence" || !start || !end || end < start) { box.style.display = "none"; return; }
  const probe = {
    id: editingId || "__probe__",
    type: "project",
    person: document.getElementById("fPerson").value,
    start, end,
    mode: formMode,
    weekends: [...editWeekends].join(","),
    freelancer: document.getElementById("fFreelancer").value.trim(),
  };
  const others = items.filter(x => x.id !== probe.id);
  const saved = items;
  items = [...others, probe];
  const v = computeLoad(probe);
  items = saved;
  document.getElementById("calcLoadVal").textContent = formMode === "planned" ? "план" : v + "%";
  box.style.display = "flex";
}

let selectedColor = COLORS[0];
function selectColor(c) {
  selectedColor = c;
  let matched = false;
  document.querySelectorAll(".swatch").forEach(s => {
    const on = s.dataset.c === c;
    s.classList.toggle("sel", on);
    if (on) matched = true;
  });
  // цвет не из палитры (сохранён из старого проекта) — добавим временный свотч, чтобы он был виден и выбран
  if (!matched && c) {
    const box = document.getElementById("swatches");
    const s = document.createElement("div");
    s.className = "swatch sel";
    s.dataset.c = c;
    s.style.background = c;
    s.title = "Цвет из проекта (не из палитры)";
    s.addEventListener("click", () => selectColor(c));
    box.appendChild(s);
  }
}
function buildSwatches() {
  const box = document.getElementById("swatches");
  box.innerHTML = "";
  for (const c of COLORS) {
    const s = document.createElement("div");
    s.className = "swatch";
    s.dataset.c = c;
    s.style.background = c;
    s.addEventListener("click", () => selectColor(c));
    box.appendChild(s);
  }
}

/* ── автокомплит по существующим проектам ── */
function showSuggest() {
  if (formType === "absence") { hideSuggest(); return; }
  const q = document.getElementById("fProject").value.trim().toLowerCase();
  const dir = projectDirectory().filter(p => !q || p.name.toLowerCase().includes(q));
  const box = document.getElementById("suggest");
  if (!dir.length) { hideSuggest(); return; }
  box.innerHTML = "";
  for (const p of dir.slice(0, 8)) {
    const opt = document.createElement("div");
    opt.className = "opt";
    opt.innerHTML = `<span class="sw" style="background:${p.color || '#888'}"></span>${escapeHtml(p.name)}`;
    opt.addEventListener("mousedown", ev => {
      ev.preventDefault();
      document.getElementById("fProject").value = p.name;
      if (p.color) selectColor(p.color);
      if (p.figma && !document.getElementById("fFigma").value) document.getElementById("fFigma").value = p.figma;
      hideSuggest();
      updateRoster();
    });
    box.appendChild(opt);
  }
  box.classList.add("open");
}
function hideSuggest() { document.getElementById("suggest").classList.remove("open"); }

/* ── «кто ещё на проекте» ── */
function updateRoster() {
  const name = document.getElementById("fProject").value.trim();
  const box = document.getElementById("roster");
  const list = document.getElementById("rosterList");
  const others = items.filter(x =>
    x.type === "project" && x.project === name && x.id !== editingId && name);
  if (!others.length) { box.style.display = "none"; return; }
  list.innerHTML = others
    .sort((a,b) => a.start.localeCompare(b.start))
    .map(x => `<div class="r-item">
        <span>${escapeHtml(x.person === OUTSOURCE && x.freelancer ? `Аутсорс — ${x.freelancer}` : x.person)}</span>
        <span class="r-dates">${fmtShort(x.start)} → ${fmtShort(x.end)} · ${x.mode === "planned" ? "план" : computeLoad(x) + "%" + (MODE_LABEL[x.mode] ? " · " + MODE_LABEL[x.mode] : "")}</span>
      </div>`).join("");
  box.style.display = "block";
}

async function saveForm() {
  const { start, end } = formDates();
  if (!start || !end) { toast("Даты в формате ДД.ММ.ГГГГ"); return; }
  if (end < start) { toast("Дата конца раньше даты начала"); return; }
  const person = document.getElementById("fPerson").value;
  const item = {
    id: editingId || ("p" + Date.now()),
    type: formType,
    person,
    project: document.getElementById("fProject").value.trim() || (formType === "absence" ? "Отпуск" : "Без названия"),
    start, end,
    color: formType === "absence" ? "" : selectedColor,
    mode: formType === "absence" ? "" : formMode,
    figma: formType === "absence" ? "" : document.getElementById("fFigma").value.trim(),
    weekends: formType === "absence" ? "" :
      [...editWeekends].filter(x => x >= start && x <= end).join(","),
    freelancer: (formType === "project" && person === OUTSOURCE) ? document.getElementById("fFreelancer").value.trim() : "",
  };
  const idx = items.findIndex(x => x.id === item.id);
  if (idx >= 0) items[idx] = item; else items.push(item);

  // цвет — свойство проекта: перекрашиваем все колбаски этого проекта и сохраняем изменённые
  const recolored = [];
  if (formType === "project") {
    const prevColor = projectColors[item.project];
    if (item.color && item.color !== prevColor) {
      for (const x of items) {
        if (x.type === "project" && x.project === item.project && x.color !== item.color) {
          x.color = item.color;
          if (x.id !== item.id) recolored.push(x);
        }
      }
    }
  }

  render();
  closeDrawer();
  await apiSave(item);
  for (const x of recolored) await apiSave(x);
  toast(API_URL ? "Сохранено в таблицу" : "Сохранено (демо-режим, без таблицы)");
}
async function deleteItem() {
  if (!editingId) return;
  items = items.filter(x => x.id !== editingId);
  render();
  closeDrawer();
  await apiDelete(editingId);
  toast(API_URL ? "Удалено из таблицы" : "Удалено (демо-режим)");
}

/* ── toast ── */
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ── тема: всегда тёмная (задана на теге <html data-theme="dark">) ── */

/* ── события ── */
document.getElementById("prevBtn").addEventListener("click", () => { viewStart = addDays(viewStart, -7); render(); });
document.getElementById("nextBtn").addEventListener("click", () => { viewStart = addDays(viewStart, 7); render(); });
document.getElementById("todayBtn").addEventListener("click", () => { viewStart = mondayOf(addDays(today(), -7)); render(); scrollToToday(); });
document.getElementById("refreshBtn").addEventListener("click", async () => { await apiLoad(); render(); toast("Данные обновлены"); });
document.getElementById("addBtn").addEventListener("click", () => openDrawer(null));
document.getElementById("absBtn").addEventListener("click", (e) => {
  absOnly = !absOnly;
  e.currentTarget.classList.toggle("on", absOnly);
  render();
  toast(absOnly ? "Только отсутствия" : "Все проекты");
});
document.getElementById("overlay").addEventListener("click", closeDrawer);
document.getElementById("saveBtn").addEventListener("click", saveForm);
document.getElementById("deleteBtn").addEventListener("click", deleteItem);
document.getElementById("dupBtn").addEventListener("click", async () => {
  if (!editingId) return;
  const src = items.find(x => x.id === editingId);
  if (!src) return;
  const copy = { ...src, id: "p" + Date.now() };
  items.push(copy);
  render();
  await apiSave(copy);
  openDrawer(copy.id);
  toast("Копия создана — поменяйте человека или даты");
});
document.getElementById("typeProject").addEventListener("click", () => setFormType("project"));
document.getElementById("typeAbsence").addEventListener("click", () => setFormType("absence"));
document.getElementById("modeActive").addEventListener("click", () => setFormMode("active"));
document.getElementById("modeBg").addEventListener("click", () => setFormMode("background"));
document.getElementById("modePlan").addEventListener("click", () => setFormMode("planned"));

/* удаление человека */
async function deletePerson(name) {
  if (name === OUTSOURCE) { toast("Аутсорс-блок удалить нельзя"); return; }
  const theirs = items.filter(x => x.person === name);
  const msg = theirs.length
    ? `У «${name}» ${theirs.length} записей на таймлайне. Удалить человека вместе с ними?`
    : `Удалить «${name}» из команды?`;
  if (!confirm(msg)) return;
  PEOPLE = PEOPLE.filter(p => p.name !== name);
  items = items.filter(x => x.person !== name);
  sortPeople(); render();
  for (const t of theirs) await apiDelete(t.id);
  await apiDeletePerson(name);
  toast(`${name} — больше не в команде`);
}

/* редактирование / добавление человека — Option+клик по имени или «+» */
let editingPerson = null;   // null = режим добавления, иначе имя редактируемого

function openPersonPop(name) {
  editingPerson = name || null;
  const p = name ? PEOPLE.find(x => x.name === name) : null;
  document.getElementById("ppTitle").textContent = p ? "Профиль" : "Новый человек";
  document.getElementById("npName").value = p ? p.name : "";
  document.getElementById("npRole").value = p ? (p.role || "middle") : "middle";
  document.getElementById("npTeam").value = p ? (p.team === "Creative" ? "Creative" : "Design") : "Design";
  document.getElementById("npAdd").textContent = p ? "Сохранить" : "Добавить";
  document.getElementById("ppEditActions").style.display = p ? "flex" : "none";
  document.getElementById("personPop").classList.add("open");
  document.getElementById("npName").focus();
}
function closePersonPop() {
  document.getElementById("personPop").classList.remove("open");
  editingPerson = null;
}
document.getElementById("npCancel").addEventListener("click", closePersonPop);

document.getElementById("npAdd").addEventListener("click", () => {
  const name = document.getElementById("npName").value.trim();
  const role = document.getElementById("npRole").value;
  const team = document.getElementById("npTeam").value;
  if (!name) { toast("Впишите имя и фамилию"); return; }

  if (editingPerson) {
    // проверка на дубль имени (если переименовали)
    if (name !== editingPerson && PEOPLE.some(p => p.name === name)) { toast("Такой человек уже есть"); return; }
    const p = PEOPLE.find(x => x.name === editingPerson);
    if (!p) { closePersonPop(); return; }
    const oldName = p.name;
    p.name = name; p.role = role; p.team = team;
    // если переименовали — переносим его записи на новое имя
    if (name !== oldName) {
      items.forEach(it => { if (it.person === oldName) it.person = name; });
    }
    sortPeople(); closePersonPop(); render();
    if (name !== oldName) {
      apiDeletePerson(oldName);
      items.filter(it => it.person === name).forEach(it => apiSave(it));
    }
    apiSavePerson(name, role, team);
    toast(`${name} — профиль обновлён`);
  } else {
    if (PEOPLE.some(p => p.name === name)) { toast("Такой человек уже есть"); return; }
    PEOPLE.push({ group: "Инхаус", name, role, team });
    sortPeople(); closePersonPop(); render();
    apiSavePerson(name, role, team);
    toast(`${name} — в команде (${team})`);
  }
});

/* Архивировать: убрать из планнинга, но не удалять — команда "Архив" (role сохраняется) */
document.getElementById("npArchive").addEventListener("click", () => {
  if (!editingPerson) return;
  const p = PEOPLE.find(x => x.name === editingPerson);
  if (!p) return;
  p.team = "Архив";
  sortPeople(); closePersonPop(); render();
  apiSavePerson(p.name, p.role, "Архив");
  toast(`${p.name} — в архиве`);
});

document.getElementById("npDelete").addEventListener("click", () => {
  if (!editingPerson) return;
  const name = editingPerson;
  closePersonPop();
  deletePerson(name);
});

document.addEventListener("click", ev => {
  const pop = document.getElementById("personPop");
  if (pop.classList.contains("open") && !pop.contains(ev.target) && ev.target.id !== "addPersonBtn") closePersonPop();
});
document.getElementById("fPerson").addEventListener("change", () => { updateFreelancerField(); updateCalcLoad(); });
document.getElementById("fFreelancer").addEventListener("input", updateCalcLoad);
document.getElementById("fStart").addEventListener("input", () => { rebuildWeekendChips(); updateCalcLoad(); });
document.getElementById("fEnd").addEventListener("input", () => { rebuildWeekendChips(); updateCalcLoad(); });
const fProject = document.getElementById("fProject");
fProject.addEventListener("input", () => { showSuggest(); updateRoster(); });
fProject.addEventListener("focus", showSuggest);
fProject.addEventListener("blur", () => setTimeout(hideSuggest, 120));
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
let resizeT;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(render, 150); });

function scrollToToday() {
  const board = document.getElementById("board");
  const off = dayDiff(viewStart, today());
  board.scrollLeft = Math.max(0, NAME_W() + off * DAY_W() - board.clientWidth / 2.5);
}

/* ── выпадающий фильтр в углу ── */
let filterOpen = false;
function toggleFilterPanel() {
  filterOpen = !filterOpen;
  const panel = document.getElementById("filterPanel");
  if (!filterOpen) { panel.classList.remove("open"); return; }
  buildFilterPanel();
  const btn = document.getElementById("filterBtn");
  const r = btn.getBoundingClientRect();
  panel.style.left = r.left + "px";
  panel.style.top = (r.bottom + 4) + "px";
  panel.classList.add("open");
}
function closeFilterPanel() {
  filterOpen = false;
  document.getElementById("filterPanel").classList.remove("open");
}
// перепозиционируем панель под кнопкой после перерисовки доски
function repositionFilterPanel() {
  const panel = document.getElementById("filterPanel");
  if (!filterOpen) return;
  const btn = document.getElementById("filterBtn");
  if (!btn) return;
  const r = btn.getBoundingClientRect();
  panel.style.left = r.left + "px";
  panel.style.top = (r.bottom + 4) + "px";
}
function applyFilter() {
  render();              // доска обновляется вживую
  buildFilterPanel();    // буллиты в панели тоже
  repositionFilterPanel();
}
function buildFilterPanel() {
  const panel = document.getElementById("filterPanel");
  const sel = nameFilter;
  panel.innerHTML = "";

  const allRow = document.createElement("div");
  allRow.className = "fp-all" + (sel.size === 0 ? " on" : "");
  allRow.textContent = "Все";
  allRow.onclick = (ev) => { ev.stopPropagation(); sel.clear(); applyFilter(); };
  panel.appendChild(allRow);

  const addSection = (label, people) => {
    if (!people.length) return;
    const head = document.createElement("div");
    head.className = "fp-team";
    const allOn = people.every(p => sel.has(p.name));
    head.innerHTML = `<span>${label}</span><span class="fp-team-toggle">${allOn ? "снять" : "все"}</span>`;
    head.onclick = (ev) => {
      ev.stopPropagation();
      const turnOn = !people.every(p => sel.has(p.name));
      people.forEach(p => turnOn ? sel.add(p.name) : sel.delete(p.name));
      applyFilter();
    };
    panel.appendChild(head);
    for (const p of people) {
      const row = document.createElement("label");
      row.className = "fp-item";
      const on = sel.has(p.name);
      row.innerHTML = `<span class="fp-box${on ? " on" : ""}"></span><span class="fp-name">${escapeHtml(p.name)}</span>`;
      row.onclick = (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        sel.has(p.name) ? sel.delete(p.name) : sel.add(p.name);
        applyFilter();
      };
      panel.appendChild(row);
    }
  };

  addSection("Дизайн", PEOPLE.filter(p => p.group === "Инхаус" && (p.team || "Design") === "Design"));
  addSection("Креатив", PEOPLE.filter(p => p.group === "Инхаус" && p.team === "Creative"));
  addSection("Аутсорс", PEOPLE.filter(p => p.group === "Аутсорс"));

  const archived = PEOPLE.filter(p => p.team === "Архив");
  if (archived.length) {
    const sep = document.createElement("div");
    sep.className = "fp-arch-title";
    sep.textContent = "Архив";
    panel.appendChild(sep);
    for (const p of archived) {
      const row = document.createElement("div");
      row.className = "fp-arch";
      row.textContent = p.name;
      row.title = "Открыть профиль (можно вернуть в команду)";
      row.onclick = () => { closeFilterPanel(); openPersonPop(p.name); };
      panel.appendChild(row);
    }
  }
}
document.addEventListener("click", ev => {
  const panel = document.getElementById("filterPanel");
  if (filterOpen && !panel.contains(ev.target) && ev.target.id !== "filterBtn" && !ev.target.closest("#filterBtn")) {
    closeFilterPanel();
  }
});

  buildSwatches();
  await apiLoad();

  scrollToToday();
})();

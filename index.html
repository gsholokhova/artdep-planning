    --bg: #FAFAF7;
    --surface: #FFFFFF;
    --ink: #1B1B1F;
    --ink-soft: #6E6E76;
    --line: #E9E9E2;
    --line-strong: #D8D8CF;
    --weekend: #F2F2EB;
    --hover: #F4F4EF;
    --panel: #F6F6F1;
    --drop: #EEF3FF;

    --abs-b: #E2E2D9;
    --today: #2B5CFF;

    --day-w: 34px;
    --radius: 8px;

  html[data-theme="dark"] {

    --surface: #1D1D21;
    --ink: #ECECEF;
    --ink-soft: #9A9AA3;

    --panel: #232328;

    --abs-b: #323238;
    color-scheme: dark;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    display: flex;
    flex-direction: column;
  }

    align-items: center;
    gap: 16px;
    padding: 14px 20px;

    background: var(--surface);
    flex-wrap: wrap;
  }

  .range-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    color: var(--ink-soft);
    min-width: 150px;
  }
  .spacer { flex: 1; }
  button {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 7px 12px;
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  button:hover { background: var(--hover); }
  button:focus-visible { outline: 2px solid var(--today); outline-offset: 1px; }
  button.primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  button.primary:hover { opacity: 0.88; background: var(--ink); }
  .nav-group { display: flex; gap: 6px; }
  .status-pill {
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 20px;
    background: #FFF4D6;
    color: #8A6A00;
    border: 1px solid #F0DFA6;
  }
  .status-pill.live { background: #E3F5EC; color: #0B7A4B; border-color: #BCE5D1; }
  html[data-theme="dark"] .status-pill { background: #3A3110; color: #E8C860; border-color: #5A4C1A; }
  html[data-theme="dark"] .status-pill.live { background: #10321F; color: #5FD39A; border-color: #1E4A30; }

  /* ── Board ───────────────────────────────── */
  .board { flex: 1; overflow: auto; position: relative; -webkit-overflow-scrolling: touch; }
  .canvas {
    position: relative;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }
  .row.filler { flex: 1; border-bottom: none; min-height: 40px; }

  .head-row {
    display: flex;
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line-strong);
  }
  .corner {
    position: sticky;
    left: 0;
    z-index: 21;
    width: var(--name-w);
    min-width: var(--name-w);
    background: var(--bg);
    border-right: 1px solid var(--line-strong);
    padding: 8px 14px 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 8px;
  }
  .corner .mini-add {
    width: 20px; height: 20px;
    padding: 0;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1;
    color: var(--ink-soft);
  }
  .person-pop {
    position: fixed;
    top: 64px; left: 16px;
    z-index: 55;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 14px;
    width: 250px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: none;
  }
  .person-pop.open { display: block; }
  .person-pop .pp-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 2px;
  }
  .person-pop label { display: block; font-size: 12px; color: var(--ink-soft); margin: 9px 0 4px; }
  .person-pop input, .person-pop select {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    font-size: 13.5px;
    font-family: 'Inter', sans-serif;
  }
  .person-pop .pp-actions { display: flex; gap: 6px; margin-top: 13px; }
  .person-pop .pp-actions button { flex: 1; }
  .tip {
    position: fixed;
    z-index: 70;
    max-width: 260px;
    background: var(--ink);
    color: var(--bg);
    font-size: 12px;
    line-height: 1.45;
    padding: 8px 11px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .12s;
  }
  .tip.show { opacity: 1; }
  .day-head {
    width: var(--day-w);
    min-width: var(--day-w);
    text-align: center;
    padding: 6px 0 5px;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .day-head .m {
    display: block;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 11px;
    color: var(--ink);
    text-transform: uppercase;
    height: 14px;
    white-space: nowrap;
    text-align: left;
    padding-left: 2px;
  }
  .day-head .d { display: block; font-weight: 500; }
  .day-head.weekend .d { color: var(--line-strong); }
  .day-head.sprint { box-shadow: inset 0 -2px 0 var(--today); }
  .day-head.today-col .d {
    color: #fff;
    background: var(--today);
    border-radius: 20px;
    width: 22px; height: 18px;
    line-height: 18px;
    margin: 0 auto;
  }

  .group-row { display: flex; position: relative; }
  .group-label {
    position: sticky;
    left: 0;
    z-index: 15;
    width: var(--name-w);
    min-width: var(--name-w);
    background: var(--bg);
    border-right: 1px solid var(--line-strong);
    padding: 14px 14px 5px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .group-track { flex: 1; }

  .row { display: flex; border-bottom: 1px solid var(--line); transition: background .1s; }
  .row.drop-target { background: var(--drop); }
  .row.drop-target .name-cell { background: var(--drop); }
  .name-cell {
    position: sticky;
    left: 0;
    z-index: 15;
    width: var(--name-w);
    min-width: var(--name-w);
    background: var(--bg);
    border-right: 1px solid var(--line-strong);
    padding: 10px 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .name-cell .nm { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
  .name-cell .role {
    display: block;
    font-weight: 400;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 1px;
  }
  .load-badge {

/* ═══════════════════════════════════════════════════════════

/* ── состояние ── */
let items = [];

/* ── утилиты дат ── */
function today() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d) { const x = new Date(d); const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function toISO(d) { return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fromISO(s) { const [y,m,dd] = s.split("-").map(Number); return new Date(y, m-1, dd); }
function dayDiff(a, b) { return Math.round((b - a) / 86400000); }
const MONTHS = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
const WD = ["пн","вт","ср","чт","пт","сб","вс"];
function fmtShort(iso) { const d = fromISO(iso); return d.getDate() + " " + MONTHS[d.getMonth()]; }
function fmtRu(iso) {
  if (!iso) return "";
  const [y,m,d] = iso.split("-");
  return `${d}.${m}.${y}`;
}
function parseRu(s) {
  const m = s.trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (!m) return null;
  const d = new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
  if (d.getDate() !== Number(m[1]) || d.getMonth() !== Number(m[2])-1) return null;
  return toISO(d);
}
function weeksLabel(start, end) {
  const days = dayDiff(fromISO(start), fromISO(end)) + 1;
  const w = days / 7;
  const s = (Math.round(w * 10) / 10).toString().replace(".", ",");
  return s.replace(",0", "") + " нед";
}

function sprintRange() {
  const s = mondayOf(today());
  return [toISO(s), toISO(addDays(s, SPRINT_WEEKS * 7 - 1))];
}

/* ── расчёт занятости ─────────────────────────
   День считается рабочим для проекта, если это будний
   день (не праздник) ИЛИ выходной, отмеченный в карточке.
   В каждый такой день загрузка делится между проектами
   пропорционально их весам интенсивности (активный 1,
   фоновый 0.5, надзор 0.2). Если суммарный вес дня меньше 1,
   у человека остаётся свободная ёмкость — надзор в одиночку
   даёт 20%, а не 100%.
   Средняя занятость на проекте = среднее по всем таким дням. */
function isBusinessDay(iso) {
  const wd = (fromISO(iso).getDay() + 6) % 7;
  return wd < 5 && !HOLIDAYS.includes(iso);
}
function weekendSet(it) {
  return new Set((it.weekends || "").split(",").filter(Boolean));
}
function dayCounts(it, iso) {
  return isBusinessDay(iso) || weekendSet(it).has(iso);
}
function concurrencyKey(it) {
  return it.person === OUTSOURCE ? OUTSOURCE + "|" + (it.freelancer || "") : it.person;
}
function computeLoad(it) {
  if (it.type !== "project") return 0;
  let sum = 0, n = 0;
  let d = fromISO(it.start);
  const end = fromISO(it.end);
  const key = concurrencyKey(it);
  while (d <= end) {
    const iso = toISO(d);
    if (dayCounts(it, iso)) {
      const totalW = items
        .filter(x =>
          x.type === "project" &&
          concurrencyKey(x) === key &&
          x.start <= iso && x.end >= iso &&
          dayCounts(x, iso))
        .reduce((s2, x) => s2 + weightOf(x), 0);
      sum += 100 * weightOf(it) / Math.max(totalW, 1);
      n++;
    }
    d = addDays(d, 1);
  }
  return n ? Math.round(sum / n) : 0;
}

function projectDirectory() {
  const map = new Map();
  for (const it of items) {
    if (it.type !== "project") continue;
    if (!map.has(it.project)) map.set(it.project, { name: it.project, color: it.color, figma: it.figma });
    else {
      const p = map.get(it.project);
      if (!p.figma && it.figma) p.figma = it.figma;
    }
  }
  return [...map.values()];
}

/* ── раскладка полос по дорожкам ── */
function computeLanes(list) {
  const sorted = [...list].sort((a,b) => a.start.localeCompare(b.start));
  const laneEnds = [];
  for (const it of sorted) {
    let lane = laneEnds.findIndex(end => end < it.start);
    if (lane === -1) { lane = laneEnds.length; laneEnds.push(it.end); }
    else laneEnds[lane] = it.end;
    it._lane = lane;
  }
  return { list: sorted, lanes: Math.max(1, laneEnds.length) };
}

const LINK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M10 14L21 3m0 0h-6m6 0v6M9 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-4"/></svg>';

function render() {
  const canvas = document.getElementById("canvas");
  const dw = DAY_W();
  canvas.style.minWidth = (NAME_W() + VIEW_DAYS * dw) + "px";
  canvas.innerHTML = "";
  rowMeta = [];

  const head = document.createElement("div");
  head.className = "head-row";
  const corner = document.createElement("div");
  corner.className = "corner";
  corner.innerHTML = IS_TOUCH
    ? "Команда"
    : `Команда <button class="mini-add" id="addPersonBtn" title="Добавить человека" aria-label="Добавить человека">+</button>`;
  const apb = corner.querySelector("#addPersonBtn");
  if (apb) apb.addEventListener("click", ev => { ev.stopPropagation(); openPersonPop(); });
  head.appendChild(corner);
  const t0 = today();
  const [sprS, sprE] = sprintRange();
  for (let i = 0; i < VIEW_DAYS; i++) {
    const d = addDays(viewStart, i);
    const dISO = toISO(d);
    const cell = document.createElement("div");
    cell.className = "day-head";
    const wd = (d.getDay()+6)%7;
    if (wd >= 5) cell.classList.add("weekend");
    if (dISO >= sprS && dISO <= sprE) cell.classList.add("sprint");
    if (dayDiff(t0, d) === 0) cell.classList.add("today-col");
    const m = document.createElement("span"); m.className = "m";
    m.textContent = (d.getDate() === 1 || i === 0) ? MONTHS[d.getMonth()] : "";
    const dd = document.createElement("span"); dd.className = "d";
    dd.textContent = d.getDate();
    cell.appendChild(m); cell.appendChild(dd);
    head.appendChild(cell);
  }
  canvas.appendChild(head);

  const groups = [...new Set(PEOPLE.map(p => p.group))];
  const todayISO = toISO(t0);
  for (const g of groups) {
    const gr = document.createElement("div");
    gr.className = "group-row";
    const gl = document.createElement("div");
    gl.className = "group-label";
    gl.textContent = g;
    gr.appendChild(gl);
    gr.appendChild(Object.assign(document.createElement("div"), { className: "group-track" }));
    canvas.appendChild(gr);

    for (const p of PEOPLE.filter(x => x.group === g)) {
      const personItems = items.filter(it => it.person === p.name);
      const { list, lanes } = computeLanes(personItems);
      const narrow = window.innerWidth <= 700;
      const rowH = Math.max(12 + lanes * 32, narrow ? 78 : 0);

      const row = document.createElement("div");
      row.className = "row";
      row.style.height = rowH + "px";
      row.dataset.person = p.name;

      const nc = document.createElement("div");
      nc.className = "name-cell";
      const inSprint = personItems.filter(it => it.type === "project" && it.start <= sprE && it.end >= sprS);
      const mainCnt = inSprint.filter(it => (it.mode || "active") !== "planned").length;
      const planCnt = inSprint.length - mainCnt;
      const onLeave = personItems.some(it => it.type === "absence" && it.start <= todayISO && it.end >= todayISO);
      const badgeText = onLeave ? "—" : (planCnt ? `${mainCnt}+${planCnt}` : `${mainCnt}`);
      nc.innerHTML = `<span class="nm">${p.name}<span class="role">${p.role}</span></span>
        <span class="load-badge ${onLeave ? "" : "l"+Math.min(mainCnt,3)}">${badgeText}</span>`;
      nc.addEventListener("click", ev => { if (ev.altKey) { ev.preventDefault(); deletePerson(p.name); } });
      const badge = nc.querySelector(".load-badge");
      badge.addEventListener("mouseenter", () => showTip(badge, badgeTipText(mainCnt, planCnt, onLeave)));
      badge.addEventListener("mouseleave", hideTip);
      badge.addEventListener("click", ev => {
        ev.stopPropagation();
        showTip(badge, badgeTipText(mainCnt, planCnt, onLeave));
        setTimeout(hideTip, 3500);
      });
      row.appendChild(nc);

      const track = document.createElement("div");
      track.className = "track";
      track.style.width = (VIEW_DAYS * dw) + "px";
      track.style.height = rowH + "px";

      for (const it of list) {
        const bar = buildBar(it, dw);
        if (bar) track.appendChild(bar);
      }
      row.appendChild(track);
      canvas.appendChild(row);
      rowMeta.push({ person: p.name, rowEl: row });
    }
  }

  // заливка колонок и сетки до низа экрана
  const filler = document.createElement("div");
  filler.className = "row filler";
  const fnc = document.createElement("div");
  fnc.className = "name-cell";
  filler.appendChild(fnc);
  const ftrack = document.createElement("div");
  ftrack.className = "track";
  ftrack.style.width = (VIEW_DAYS * dw) + "px";
  filler.appendChild(ftrack);
  canvas.appendChild(filler);

  // линия «сегодня»
  const off = dayDiff(viewStart, t0);
  if (off >= 0 && off < VIEW_DAYS) {
    const line = document.createElement("div");
    line.className = "today-line";
    line.style.left = (NAME_W() + off * dw + dw / 2) + "px";
    canvas.appendChild(line);
    requestAnimationFrame(() => { line.style.height = canvas.scrollHeight + "px"; });
  }

  const endD = addDays(viewStart, VIEW_DAYS - 1);
  document.getElementById("rangeLabel").textContent =
    `${viewStart.getDate()} ${MONTHS[viewStart.getMonth()]} — ${endD.getDate()} ${MONTHS[endD.getMonth()]} ${endD.getFullYear()}`;
}

function badgeTipText(main, plan, onLeave) {
  let s;
  if (onLeave) s = "Сейчас отсутствует — проекты в спринте не в счёт.";
  else if (main === 0) s = "В этом спринте нет проектов в работе — можно ставить новый.";
  else if (main === 1) s = "Один проект в спринте — здоровый фокус.";
  else if (main === 2) s = "Два проекта параллельно — на грани: следите за приоритетами.";
  else s = `В работе ${main} проекта параллельно — высокий риск расфокуса. Стоит перенести часть или подключить аутсорс.`;
  if (plan) s += ` Плюс ${plan} в планах.`;
  return s;
}
function showTip(el, text) {
  const tip = document.getElementById("tip");
  tip.textContent = text;
  const r = el.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 275)) + "px";
  tip.style.top = (r.bottom + 6) + "px";
  tip.classList.add("show");
}
function hideTip() { document.getElementById("tip").classList.remove("show"); }

function barMeta(it) {
  if (it.type === "absence") return weeksLabel(it.start, it.end);
  if ((it.mode || "active") === "planned") return `${weeksLabel(it.start, it.end)} · план`;
  const mw = MODE_LABEL[it.mode] ? ` · ${MODE_LABEL[it.mode]}` : "";
  return `${weeksLabel(it.start, it.end)} · ${computeLoad(it)}%${mw}`;
}

function buildBar(it, dw) {
  const s = fromISO(it.start), e = fromISO(it.end);
  const x1 = dayDiff(viewStart, s), x2 = dayDiff(viewStart, e) + 1;
  if (x2 <= 0 || x1 >= VIEW_DAYS) return null;
  const clipL = Math.max(0, x1), clipR = Math.min(VIEW_DAYS, x2);

  const bar = document.createElement("div");
  const mode = it.mode || "active";
  bar.className = "bar"
    + (it.type === "absence" ? " absence" : "")
    + (it.type === "project" && mode === "planned" ? " planned" : "")
    + (it.type === "project" && mode === "background" ? " bg-mode" : "");
  bar.style.left = (clipL * dw + 2) + "px";
  bar.style.width = Math.max((clipR - clipL) * dw - 4, 20) + "px";
  bar.style.top = (8 + it._lane * 32) + "px";
  if (it.type !== "absence") {
    if (mode === "planned") bar.style.color = it.color || "#888";
    else bar.style.background = `color-mix(in srgb, ${it.color || "#888"} 68%, #ffffff)`;
  }

  const label = it.freelancer ? `${it.project} — ${it.freelancer}` : it.project;
  const meta = barMeta(it);
  bar.innerHTML = `
    ${it.figma ? `<a class="b-link" href="${escapeAttr(it.figma)}" target="_blank" rel="noopener" title="Открыть фигму">${LINK_SVG}</a>` : ""}
    <span class="b-name">${escapeHtml(label)}</span>
    <span class="b-meta">${meta}</span>
    <span class="handle h-start"></span>
    <span class="handle h-end"></span>`;
  bar.title = `${label} · ${fmtShort(it.start)} → ${fmtShort(it.end)} · ${meta}`;

  // подсветка отработанных выходных на колбаске
  for (const wIso of weekendSet(it)) {
    const idx = dayDiff(viewStart, fromISO(wIso));
    if (idx < clipL || idx >= clipR) continue;
    const ov = document.createElement("span");
    ov.className = "wknd";
    ov.style.left = ((idx - clipL) * dw) + "px";
    ov.style.width = dw + "px";
    if (it.type === "project" && mode !== "planned") ov.style.background = it.color || "#888";
    ov.title = "Работа в выходной: " + fmtShort(wIso);
    bar.appendChild(ov);
  }
  if (weekendSet(it).size) bar.title += " · работа в выходные: " + [...weekendSet(it)].map(fmtShort).join(", ");

  const link = bar.querySelector(".b-link");
  if (link) link.addEventListener("pointerdown", ev => ev.stopPropagation());

  if (IS_TOUCH) {
    bar.classList.add("no-drag");
    bar.addEventListener("click", ev => { if (!ev.target.closest("a")) openDrawer(it.id); });
  } else {
    bar.addEventListener("pointerdown", ev => startDrag(ev, it, bar));
  }
  return bar;
}

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

/* ── drag: перенос, смена человека, ресайз за края ── */
let drag = null;

function startDrag(ev, it, bar) {
  ev.preventDefault();
  const zone = ev.target.classList.contains("h-start") ? "start"
             : ev.target.classList.contains("h-end") ? "end" : "move";
  // Option/Alt + перетаскивание = дублирование проекта
  const dup = ev.altKey && zone === "move" && it.type === "project";
  let dragIt = it, visual = bar;
  if (dup) {
    dragIt = { ...it, id: "p" + Date.now() };
    items.push(dragIt);
    visual = bar.cloneNode(true);
    bar.parentElement.appendChild(visual);
  }
  drag = {
    it: dragIt, bar, visual, dup, zone,
    x0: ev.clientX, y0: ev.clientY,
    origStart: it.start, origEnd: it.end, origPerson: it.person,
    origId: it.id,
    moved: false,
    origLeft: parseFloat(bar.style.left),
    origWidth: parseFloat(bar.style.width),
    targetPerson: it.person,
    lastTargetRow: null,
  };
  bar.setPointerCapture(ev.pointerId);
  bar.addEventListener("pointermove", onDragMove);
  bar.addEventListener("pointerup", onDragEnd);
  bar.addEventListener("pointercancel", onDragEnd);
}

function onDragMove(ev) {
  if (!drag) return;
  const dw = DAY_W();
  const dx = ev.clientX - drag.x0;
  const dy = ev.clientY - drag.y0;
  if (!drag.moved && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
  drag.moved = true;
  drag.visual.classList.add("dragging");

  const dDays = Math.round(dx / dw);

  if (drag.zone === "move") {
    drag.it.start = toISO(addDays(fromISO(drag.origStart), dDays));
    drag.it.end   = toISO(addDays(fromISO(drag.origEnd), dDays));
    drag.visual.style.left = (drag.origLeft + dDays * dw) + "px";

    const canvas = document.getElementById("canvas");
    const cy = ev.clientY - canvas.getBoundingClientRect().top;
    let target = null;
    for (const rm of rowMeta) {
      const top = rm.rowEl.offsetTop, h = rm.rowEl.offsetHeight;
      if (cy >= top && cy < top + h) { target = rm; break; }
    }
    if (drag.lastTargetRow) drag.lastTargetRow.classList.remove("drop-target");
    if (target && target.person !== drag.origPerson) {
      target.rowEl.classList.add("drop-target");
      drag.lastTargetRow = target.rowEl;
      drag.targetPerson = target.person;
      const srcRow = rowMeta.find(r => r.person === drag.origPerson).rowEl;
      drag.visual.style.transform = `translateY(${target.rowEl.offsetTop - srcRow.offsetTop}px)`;
    } else {
      drag.targetPerson = drag.origPerson;
      drag.lastTargetRow = null;
      drag.visual.style.transform = "";
    }
  } else if (drag.zone === "start") {
    let ns = toISO(addDays(fromISO(drag.origStart), dDays));
    if (ns > drag.it.end) ns = drag.it.end;
    drag.it.start = ns;
    const shift = dayDiff(fromISO(drag.origStart), fromISO(ns));
    drag.visual.style.left = (drag.origLeft + shift * dw) + "px";
    drag.visual.style.width = Math.max(drag.origWidth - shift * dw, dw - 4) + "px";
  } else {
    let ne = toISO(addDays(fromISO(drag.origEnd), dDays));
    if (ne < drag.it.start) ne = drag.it.start;
    drag.it.end = ne;
    const shift = dayDiff(fromISO(drag.origEnd), fromISO(ne));
    drag.visual.style.width = Math.max(drag.origWidth + shift * dw, dw - 4) + "px";
  }

  const metaEl = drag.visual.querySelector(".b-meta");
  if (metaEl) metaEl.textContent = barMeta(drag.it);
}

async function onDragEnd(ev) {
  if (!drag) return;
  const d = drag; drag = null;
  d.visual.classList.remove("dragging");
  if (d.lastTargetRow) d.lastTargetRow.classList.remove("drop-target");
  d.bar.releasePointerCapture(ev.pointerId);
  d.bar.removeEventListener("pointermove", onDragMove);
  d.bar.removeEventListener("pointerup", onDragEnd);
  d.bar.removeEventListener("pointercancel", onDragEnd);

  if (!d.moved) {
    if (d.dup) {
      items = items.filter(x => x.id !== d.it.id);
      d.visual.remove();
    }
    openDrawer(d.origId);
    return;
  }

  if (d.zone === "move" && d.targetPerson !== d.origPerson) {
    d.it.person = d.targetPerson;
    if (d.it.person !== OUTSOURCE) d.it.freelancer = "";
  }
  // отметки выходных, выпавшие из нового диапазона, убираем
  d.it.weekends = [...weekendSet(d.it)]
    .filter(x => x >= d.it.start && x <= d.it.end)
    .join(",");

  const changed = d.dup || d.it.start !== d.origStart || d.it.end !== d.origEnd || d.it.person !== d.origPerson;
  render();
  if (changed) {
    await apiSave(d.it);
    toast(d.dup ? "Продублировано" : (API_URL ? "Сохранено в таблицу" : "Изменено (демо-режим)"));
  }
}

}

/* выходные внутри диапазона — чипсы для отметки работы */
function formDates() {
  return {
    start: parseRu(document.getElementById("fStart").value),
    end: parseRu(document.getElementById("fEnd").value),
  };
}
function rebuildWeekendChips() {
  const box = document.getElementById("weekendField");
  const chips = document.getElementById("weekendChips");
  const { start, end } = formDates();
  if (formType === "absence" || !start || !end || end < start) { box.style.display = "none"; return; }
  chips.innerHTML = "";
  let found = 0;
  let d = fromISO(start);
  const endD = fromISO(end);
  while (d <= endD && found < 40) {
    const iso = toISO(d);
    const wd = (d.getDay()+6)%7;
    if (wd >= 5 || HOLIDAYS.includes(iso)) {
      found++;
      const chip = document.createElement("span");
      chip.className = "chip" + (editWeekends.has(iso) ? " on" : "");
      chip.textContent = `${WD[wd]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
      chip.addEventListener("click", () => {
        if (editWeekends.has(iso)) editWeekends.delete(iso); else editWeekends.add(iso);
        chip.classList.toggle("on");
        updateCalcLoad();
      });
      chips.appendChild(chip);
    }
    d = addDays(d, 1);
  }
  box.style.display = found ? "block" : "none";
}

/* живой предпросмотр расчётной занятости в карточке */
function updateCalcLoad() {
  const box = document.getElementById("calcLoad");
  const { start, end } = formDates();
  if (formType === "absence" || !start || !end || end < start) { box.style.display = "none"; return; }
  const probe = {
    id: editingId || "__probe__",
    type: "project",
    person: document.getElementById("fPerson").value,
    start, end,
    mode: formMode,
    weekends: [...editWeekends].join(","),
    freelancer: document.getElementById("fFreelancer").value.trim(),
  };
  const others = items.filter(x => x.id !== probe.id);
  const saved = items;
  items = [...others, probe];
  const v = computeLoad(probe);
  items = saved;
  document.getElementById("calcLoadVal").textContent = formMode === "planned" ? "план" : v + "%";
  box.style.display = "flex";
}

let selectedColor = COLORS[0];
function selectColor(c) {
  selectedColor = c;
  let matched = false;
  document.querySelectorAll(".swatch").forEach(s => {
    const on = s.dataset.c === c;
    s.classList.toggle("sel", on);
    if (on) matched = true;
  });
  // цвет не из палитры (например, рандомный из сохранённого проекта) — показываем на рандом-свотче
  if (!matched) {
    const r = document.getElementById("randSwatch");
    if (r) { r.dataset.c = c; r.style.background = c; r.classList.add("sel", "filled"); }
  }
}
function randomBrightColor() {
  const h = Math.floor(Math.random() * 360);
  const s = 72 + Math.random() * 20;   // насыщенный
  const l = 48 + Math.random() * 10;   // яркий, но читаемый с белым текстом
  const f = n => {
    const k = (n + h / 30) % 12;
    const a = (s / 100) * Math.min(l / 100, 1 - l / 100);
    const v = l / 100 - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
    return Math.round(255 * v).toString(16).padStart(2, "0");
  };
  return "#" + f(0) + f(8) + f(4);
}
function buildSwatches() {
  const box = document.getElementById("swatches");
  box.innerHTML = "";
  for (const c of COLORS) {
    const s = document.createElement("div");
    s.className = "swatch";
    s.dataset.c = c;
    s.style.background = c;
    s.addEventListener("click", () => selectColor(c));
    box.appendChild(s);
  }
  const r = document.createElement("div");
  r.className = "swatch random";
  r.id = "randSwatch";
  r.textContent = "?";
  r.title = "Рандомный яркий цвет — кликайте, пока не понравится";
  r.addEventListener("click", () => {
    const c = randomBrightColor();
    r.style.background = c;
    r.dataset.c = c;
    r.classList.add("filled");
    selectColor(c);
  });
  box.appendChild(r);
}

/* ── автокомплит по существующим проектам ── */
function showSuggest() {
  if (formType === "absence") { hideSuggest(); return; }
  const q = document.getElementById("fProject").value.trim().toLowerCase();
  const dir = projectDirectory().filter(p => !q || p.name.toLowerCase().includes(q));
  const box = document.getElementById("suggest");
  if (!dir.length) { hideSuggest(); return; }
  box.innerHTML = "";
  for (const p of dir.slice(0, 8)) {
    const opt = document.createElement("div");
    opt.className = "opt";
    opt.innerHTML = `<span class="sw" style="background:${p.color || '#888'}"></span>${escapeHtml(p.name)}`;
    opt.addEventListener("mousedown", ev => {
      ev.preventDefault();
      document.getElementById("fProject").value = p.name;
      if (p.color) selectColor(p.color);
      if (p.figma && !document.getElementById("fFigma").value) document.getElementById("fFigma").value = p.figma;
      hideSuggest();
      updateRoster();
    });
    box.appendChild(opt);
  }
  box.classList.add("open");
}
function hideSuggest() { document.getElementById("suggest").classList.remove("open"); }

/* ── «кто ещё на проекте» ── */
function updateRoster() {
  const name = document.getElementById("fProject").value.trim();
  const box = document.getElementById("roster");
  const list = document.getElementById("rosterList");
  const others = items.filter(x =>
    x.type === "project" && x.project === name && x.id !== editingId && name);
  if (!others.length) { box.style.display = "none"; return; }
  list.innerHTML = others
    .sort((a,b) => a.start.localeCompare(b.start))
    .map(x => `<div class="r-item">
        <span>${escapeHtml(x.person === OUTSOURCE && x.freelancer ? `Аутсорс — ${x.freelancer}` : x.person)}</span>
        <span class="r-dates">${fmtShort(x.start)} → ${fmtShort(x.end)} · ${x.mode === "planned" ? "план" : computeLoad(x) + "%" + (MODE_LABEL[x.mode] ? " · " + MODE_LABEL[x.mode] : "")}</span>
      </div>`).join("");
  box.style.display = "block";
}

async function saveForm() {
  const { start, end } = formDates();
  if (!start || !end) { toast("Даты в формате ДД.ММ.ГГГГ"); return; }
  if (end < start) { toast("Дата конца раньше даты начала"); return; }
  const person = document.getElementById("fPerson").value;
  const item = {
    id: editingId || ("p" + Date.now()),
    type: formType,
    person,
    project: document.getElementById("fProject").value.trim() || (formType === "absence" ? "Отпуск" : "Без названия"),
    start, end,
    color: formType === "absence" ? "" : selectedColor,
    mode: formType === "absence" ? "" : formMode,
    figma: formType === "absence" ? "" : document.getElementById("fFigma").value.trim(),
    weekends: formType === "absence" ? "" :
      [...editWeekends].filter(x => x >= start && x <= end).join(","),
    freelancer: (formType === "project" && person === OUTSOURCE) ? document.getElementById("fFreelancer").value.trim() : "",
  };
  const idx = items.findIndex(x => x.id === item.id);
  if (idx >= 0) items[idx] = item; else items.push(item);
  render();
  closeDrawer();
  await apiSave(item);
  toast(API_URL ? "Сохранено в таблицу" : "Сохранено (демо-режим, без таблицы)");
}
async function deleteItem() {
  if (!editingId) return;
  items = items.filter(x => x.id !== editingId);
  render();
  closeDrawer();
  await apiDelete(editingId);
  toast(API_URL ? "Удалено из таблицы" : "Удалено (демо-режим)");
}

/* ── toast ── */
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ── тема: по умолчанию берём системную, кнопка ◐ переключает ── */
if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
  document.documentElement.dataset.theme = "dark";
}
function toggleTheme() {
  const el = document.documentElement;
  el.dataset.theme = el.dataset.theme === "dark" ? "" : "dark";
}

/* ── события ── */
document.getElementById("prevBtn").addEventListener("click", () => { viewStart = addDays(viewStart, -7); render(); });
document.getElementById("nextBtn").addEventListener("click", () => { viewStart = addDays(viewStart, 7); render(); });
document.getElementById("todayBtn").addEventListener("click", () => { viewStart = mondayOf(addDays(today(), -7)); render(); scrollToToday(); });
document.getElementById("refreshBtn").addEventListener("click", async () => { await apiLoad(); render(); toast("Данные обновлены"); });
document.getElementById("addBtn").addEventListener("click", () => openDrawer(null));
document.getElementById("themeBtn").addEventListener("click", toggleTheme);
document.getElementById("overlay").addEventListener("click", closeDrawer);
document.getElementById("saveBtn").addEventListener("click", saveForm);
document.getElementById("deleteBtn").addEventListener("click", deleteItem);
document.getElementById("dupBtn").addEventListener("click", async () => {
  if (!editingId) return;
  const src = items.find(x => x.id === editingId);
  if (!src) return;
  const copy = { ...src, id: "p" + Date.now() };
  items.push(copy);
  render();
  await apiSave(copy);
  openDrawer(copy.id);
  toast("Копия создана — поменяйте человека или даты");
});
document.getElementById("typeProject").addEventListener("click", () => setFormType("project"));
document.getElementById("typeAbsence").addEventListener("click", () => setFormType("absence"));
document.getElementById("modeActive").addEventListener("click", () => setFormMode("active"));
document.getElementById("modeBg").addEventListener("click", () => setFormMode("background"));
document.getElementById("modePlan").addEventListener("click", () => setFormMode("planned"));

/* удаление человека — спрятано за Option/Alt + клик по имени */
async function deletePerson(name) {
  if (name === OUTSOURCE) { toast("Аутсорс-блок удалить нельзя"); return; }
  const theirs = items.filter(x => x.person === name);
  const msg = theirs.length
    ? `У «${name}» ${theirs.length} записей на таймлайне. Удалить человека вместе с ними?`
    : `Удалить «${name}» из команды?`;
  if (!confirm(msg)) return;
  PEOPLE = PEOPLE.filter(p => p.name !== name);
  items = items.filter(x => x.person !== name);
  render();
  for (const t of theirs) await apiDelete(t.id);
  await apiDeletePerson(name);
  toast(`${name} — больше не в команде`);
}

/* добавление человека в команду */
function openPersonPop() {
  document.getElementById("npName").value = "";
  document.getElementById("npRole").value = "middle";
  document.getElementById("personPop").classList.add("open");
  document.getElementById("npName").focus();
}
function closePersonPop() { document.getElementById("personPop").classList.remove("open"); }
document.getElementById("npCancel").addEventListener("click", closePersonPop);
document.getElementById("npAdd").addEventListener("click", () => {
  const name = document.getElementById("npName").value.trim();
  if (!name) { toast("Впишите имя и фамилию"); return; }
  if (PEOPLE.some(p => p.name === name)) { toast("Такой человек уже есть"); return; }
  const role = document.getElementById("npRole").value;
  const idx = PEOPLE.findIndex(p => p.name === OUTSOURCE);
  PEOPLE.splice(idx, 0, { group: "Инхаус", name, role });
  closePersonPop();
  render();
  apiSavePerson(name, role);
  toast(`${name} — в команде`);
});
document.addEventListener("click", ev => {
  const pop = document.getElementById("personPop");
  if (pop.classList.contains("open") && !pop.contains(ev.target) && ev.target.id !== "addPersonBtn") closePersonPop();
});
document.getElementById("fPerson").addEventListener("change", () => { updateFreelancerField(); updateCalcLoad(); });
document.getElementById("fFreelancer").addEventListener("input", updateCalcLoad);
document.getElementById("fStart").addEventListener("input", () => { rebuildWeekendChips(); updateCalcLoad(); });
document.getElementById("fEnd").addEventListener("input", () => { rebuildWeekendChips(); updateCalcLoad(); });
const fProject = document.getElementById("fProject");
fProject.addEventListener("input", () => { showSuggest(); updateRoster(); });
fProject.addEventListener("focus", showSuggest);
fProject.addEventListener("blur", () => setTimeout(hideSuggest, 120));
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
let resizeT;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(render, 150); });

function scrollToToday() {
  const board = document.getElementById("board");
  const off = dayDiff(viewStart, today());
  board.scrollLeft = Math.max(0, NAME_W() + off * DAY_W() - board.clientWidth / 2.5);
}

/* ── старт ── */
(async function init() {
  buildSwatches();
  await apiLoad();
  render();
  scrollToToday();
})();
</script>
